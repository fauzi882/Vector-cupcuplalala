name: Build SystemCore

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | sdkmanager --licenses 2>/dev/null || true
          # coba stable dulu, fallback ke preview channel
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.16248370" \
            "platform-tools" || true
          # install SDK 37 dari preview channel
          sdkmanager --channel=3 "platforms;android-37" \
            "build-tools;37.0.0" 2>/dev/null || \
          sdkmanager --channel=1 "platforms;android-37" \
            "build-tools;37.0.0" 2>/dev/null || true
          # fallback: symlink 35 sebagai 37
          ls $ANDROID_HOME/platforms/
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -sf $ANDROID_HOME/platforms/android-35 \
              $ANDROID_HOME/platforms/android-37 || true
          fi
          ls $ANDROID_HOME/platforms/

      - name: Upgrade Ninja
        run: |
          pip install ninja
          NINJA_PATH=$(python3 -c "import ninja; print(ninja.BIN_DIR)")/ninja
          sudo cp $NINJA_PATH /usr/local/lib/android/sdk/cmake/3.31.5/bin/ninja
          /usr/local/lib/android/sdk/cmake/3.31.5/bin/ninja --version

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release
        run: ./gradlew :zygisk:zipRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload zygisk release
        uses: actions/upload-artifact@v4
        with:
          name: SystemCore-Release
          path: zygisk/build/release/*.zip
          if-no-files-found: warn
